packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.8.0
  "@cloudflare/vite-plugin": ^1.54.0
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  "@vitejs/plugin-react": ^6.1.1
  "@vitest/browser-playwright": 5.0.1
  class-variance-authority: ^0.7.1
  cn: ^0.2.5
  lucide-react: ^1.41.0
  pdfjs-dist: ^6.2.108
  playwright: ^1.62.1
  react: ^19.2.8
  react-dom: ^19.2.8
  react-error-boundary: ^6.1.3
  react-router: ^8.3.1
  shadcn: ^4.21.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
  vite-plus: 1.0.0-rc.1
  vitest-browser-react: ^2.2.0
  wrangler: ^4.126.0
  vitest: 5.0.1

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

minimumReleaseAgeExclude:
  - "@base-ui/react@1.8.0"
  - "@base-ui/utils@0.4.0"
  - cn@0.2.5
  - lucide-react@1.41.0
  - shadcn@4.21.0
  - "@voidzero-dev/vite-plus-core@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0-rc.1"
  - vite-plus@1.0.0-rc.1

allowBuilds:
  esbuild: true
  workerd: true
