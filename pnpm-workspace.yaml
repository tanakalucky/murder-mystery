packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.8.0
  "@cloudflare/vite-plugin": ^1.54.0
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  "@vitejs/plugin-react": ^6.1.1
  "@vitest/browser-playwright": 4.1.11
  class-variance-authority: ^0.7.1
  cn: ^0.2.5
  lucide-react: ^1.41.0
  pdfjs-dist: ^6.2.108
  playwright: ^1.62.1
  react: ^19.2.8
  react-dom: ^19.2.8
  react-error-boundary: ^6.1.3
  shadcn: ^4.21.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  vitest-browser-react: ^2.2.0
  wrangler: ^4.126.0
overrides:
  vite@*: "catalog:"
  # Share the Vitest copy that `vite-plus` bundles, so the Playwright browser
  # provider and `vp test` never end up with two sets of Vitest internals.
  vitest: 4.1.11
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@base-ui/react@1.8.0"
  - "@base-ui/utils@0.4.0"
  - cn@0.2.5
  - lucide-react@1.41.0
  - shadcn@4.21.0
# どちらもプラットフォーム別パッケージからバイナリを取得する。プレースホルダのままだと
# pnpm が ERR_PNPM_IGNORED_BUILDS で終了コード 1 を返す。
allowBuilds:
  esbuild: true
  workerd: true
