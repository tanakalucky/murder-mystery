packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.8.0
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  "@vitejs/plugin-react": ^6.1.1
  class-variance-authority: ^0.7.1
  cn: ^0.2.5
  lucide-react: ^1.41.0
  react: ^19.2.8
  react-dom: ^19.2.8
  shadcn: ^4.21.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@base-ui/react@1.8.0"
  - "@base-ui/utils@0.4.0"
  - cn@0.2.5
  - lucide-react@1.41.0
  - shadcn@4.21.0
