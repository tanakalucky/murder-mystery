name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy pdf-manager
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build
        run: vp run pdf-manager#build

      # ワークスペースの wrangler をそのまま使う。@cloudflare/vite-plugin が書き出した
      # dist/wrangler.json に wrangler 側がリダイレクトする。
      - name: Deploy
        run: vp -C apps/pdf-manager exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
