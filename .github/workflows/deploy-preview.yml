name: Deploy preview

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy pdf-manager preview
    runs-on: ubuntu-latest
    environment: preview
    # フォークからの PR には Secrets が渡らないので、同一リポジトリのブランチだけを対象にする
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Derive the preview alias
        id: alias
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # プレビュー URL のホスト名は 63 文字まで。Worker 名 と
          # 区切りの "-" を差し引いた 51 文字が別名の上限になる。
          alias=$(
            printf '%s' "$BRANCH" |
              sed 's|^[^/]*/||' |
              tr '[:upper:]' '[:lower:]' |
              sed 's|[^a-z0-9]|-|g' |
              cut -c 1-51
          )
          echo "value=${alias%-}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: vp run pdf-manager#build

      - name: Upload the preview version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: ${{ steps.alias.outputs.value }}
        run: |
          vp -C apps/pdf-manager exec wrangler versions upload --preview-alias "$ALIAS" | tee upload.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' upload.log | tail -1)
          {
            echo "### プレビュー \`$ALIAS\`"
            echo
            if [ -n "$url" ]; then
              echo "$url"
            else
              echo "URL をログから読み取れませんでした。上のステップのログを確認してください。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
