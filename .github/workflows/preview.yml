name: Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to reconcile (open deploys; closed cleans up)
        required: true
        type: string

permissions: {}

concurrency:
  group: preview-${{ github.repository_id }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id) ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      # Never check out PR code in this credential-bearing job.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: false

      - name: Reconcile the current PR state
        run: python3 -B tools/deploy/cloudflare.py preview
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
